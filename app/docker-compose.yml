services:
  mongo:
    image: mongo:7
    container_name: vetcare-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: vetcare
      MONGO_INITDB_ROOT_PASSWORD: vetcare123
      MONGO_INITDB_DATABASE: vetcare
      TZ: America/Bogota
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1
    container_name: vetcare-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://vetcare:vetcare123@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
      TZ: America/Bogota
    depends_on:
      mongo:
        condition: service_healthy

  api:
    build: ./api
    container_name: vetcare-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Dentro de la red de Docker, Mongo se llama "mongo", no "localhost"
      MONGO_URI: mongodb://vetcare:vetcare123@mongo:27017/vetcare?authSource=admin
      CORS_ORIGIN: http://localhost:4200
      BETTER_AUTH_URL: http://localhost:3000
      # Solo para desarrollo local. En producción va como secreto de la plataforma.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      TZ: America/Bogota
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    container_name: vetcare-web
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mongo_data:
