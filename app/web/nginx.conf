server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Archivos con hash: cache largo
  location ~* \.(?:js|css|woff2?|ico|svg|png|jpg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta desconocida vuelve a index.html (Angular Router)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
